# Отступ от границы барьера (в блоках) - чтобы не спавнить вплотную к границе
border-margin: 50
# Число попыток найти безопасную случайную точку
search-attempts: 10
# Радиус поиска безопасного блока вокруг выбранной точки (если поверхность опасна)
safe-search-radius: 20
# Миры, где работает случайный спавн (пустой список = все миры)
worlds: []
# Дополнительное ограничение зоны спавна через gamerule (0 = только барьер):
#   /gamerule randomSpawnRadius <радиус в блоках>
# Игроки спавнятся в пересечении барьера и круга этого радиуса вокруг мирового спавна.
# Значение хранится в данных мира и переживает рестарт.
